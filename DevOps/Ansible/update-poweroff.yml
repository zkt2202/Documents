- hosts: all
  become: true
  become_method: sudo
  become_user: root
  vars:
    reboot_connect_timeout: 5
    reboot_post_reboot_delay: 5
    reboot_timeout: 400
    kubernetes_allow_pods_on_master: true
  pre_tasks:
   # Upgrade RHEL family OS packages
    - name: Upgrade RHEL Family OS packages
      yum:
        name: '*'
        state: latest
      when: ansible_os_family == "RedHat"

    # Debian Family upgrade
    - name: Update repositories cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Update all packages to their latest version
      apt:
        name: "*"
        state: latest
      when: ansible_os_family == "Debian"

    - name: Upgrade the OS (apt-get dist-upgrade)
      apt:
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Reboot host
      reboot:
        connect_timeout: "{{ reboot_connect_timeout }}"
        post_reboot_delay: "{{ reboot_post_reboot_delay }}"
        reboot_timeout: "{{ reboot_timeout }}"

    # Shutdown after upgrade.
    - name: Unconditionally shut down the machine with all defaults
      community.general.shutdown:
